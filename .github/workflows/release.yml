name: Release desktop builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/github-script@v8
        id: release
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              }));
              if (!release.draft) {
                throw new Error(`Release for ${tag} already exists and is published`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `SFTP Client ${tag}`,
                body: 'Cross-platform SFTP Client release. macOS packages are ad-hoc signed but not notarized; macOS may require allowing the app in Privacy & Security.',
                draft: true,
                prerelease: false,
              }));
            }
            core.setOutput('release_id', release.id);

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.args }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-26-intel
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Portable Windows build: the raw release exe (no installer) uploaded as an asset.
      - name: Build portable Windows executable
        if: matrix.platform == 'windows-latest'
        run: npx tauri build --no-bundle

      - name: Upload portable Windows executable to release
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item "src-tauri/target/release/sftp-client-tauri.exe" "SFTP.Client_1.0.0_x64_portable.exe"
          gh release upload $tag "SFTP.Client_1.0.0_x64_portable.exe" --clobber

  publish:
    name: Publish GitHub release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
