[package]
name = "sftp-client-tauri"
version = "1.0.0"
description = "A lightweight SFTP desktop client"
authors = ["SFTP Client contributors"]
edition = "2021"

[lib]
name = "sftp_client_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

# Static OpenSSL on macOS: linking the Homebrew dylib causes the released
# app to abort at launch on machines without the matching libraries.
[target.'cfg(target_os = "macos")'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
